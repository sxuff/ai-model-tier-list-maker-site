<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>AI Model Tier List Maker</title>
<style>
:root{--bg:#080808;--panel:#0e0e0f;--line:#292a2d;--ink:#f5f5f7;--muted:#8d8e94;--chip:#141416;--chipline:#34353a;--focus:#fff}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#202126 0,transparent 36%),var(--bg)}
button,input{font:inherit}.app{width:min(1260px,calc(100% - 28px));margin:0 auto;padding:24px 0 64px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.segmented{display:flex;background:#111214;border:1px solid #2d2e32;padding:4px;border-radius:10px;gap:4px}.segmented button,.tool-btn{border:0;color:#a9abb1;background:transparent;border-radius:7px;min-height:40px;padding:0 14px;cursor:pointer}.segmented button.active{color:#fff;background:#2a2b2f}.tool-btn{border:1px solid #303136;background:#111214;color:#e6e6e8}.tool-btn:hover,.segmented button:hover{color:#fff;border-color:#4a4b50}.tool-btn.primary{background:#f5f5f7;color:#09090a;border-color:#f5f5f7;font-weight:750}.tool-btn.primary:hover{background:white}.spacer{flex:1}.search{height:40px;width:min(230px,100%);border:1px solid #303136;border-radius:8px;background:#111214;color:#fff;padding:0 12px;outline:none}.search:focus{border-color:#73757d;box-shadow:0 0 0 3px #ffffff12}
.board-frame{background:#09090a;border:1px solid #25262a;box-shadow:0 18px 70px #0008}.board-head{display:flex;align-items:center;gap:14px;padding:24px 24px 22px}.board-head h1{font-size:31px;letter-spacing:-1.05px;line-height:1;margin:0;font-weight:850}.count{font-size:14px;color:#8c8e94}.open-badge{font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:.08em;color:#b7fac9;border:1px solid #28543a;background:#11251a;border-radius:99px;padding:6px 8px;display:none}.board-frame[data-preset="open"] .open-badge{display:inline-flex}.board{border-top:1px solid var(--line)}.tier{display:grid;grid-template-columns:116px minmax(0,1fr) 52px;min-height:106px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0c0c0d,#0a0a0b)}.tier:last-child{border-bottom:0}.tier-label{border:0;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;color:#070708;font-size:28px;font-weight:900;line-height:1.05;padding:10px;outline:none;word-break:normal;overflow-wrap:anywhere;cursor:text;text-shadow:0 1px #ffffff44}.tier-label.long{font-size:20px}.tier-label:focus{box-shadow:inset 0 0 0 3px #fff}.items{display:flex;align-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:18px 16px;min-width:0}.items:empty:after{content:"drop models here";color:#3c3d42;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.tier-actions{border-left:1px solid #17181a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.icon-btn{width:34px;height:34px;border:0;background:transparent;color:#4b4d53;font-size:22px;line-height:1;cursor:pointer;border-radius:7px}.icon-btn:hover{color:white;background:#1e1f22}.model{display:flex;align-items:center;gap:10px;min-height:52px;padding:7px 10px;border:1px solid var(--chipline);border-radius:8px;background:linear-gradient(#18181b,#121214);box-shadow:0 3px 10px #0007;cursor:grab;user-select:none;white-space:nowrap;max-width:100%;transition:border-color .15s,transform .15s,opacity .15s}.model:hover{border-color:#56585e;transform:translateY(-1px)}.model:active{cursor:grabbing}.model.filtered{display:none}.logo{width:36px;height:36px;border-radius:8px;object-fit:cover;background:white;padding:2px;flex:0 0 auto}.model-name{font-size:17px;font-weight:650;letter-spacing:-.25px;overflow:hidden;text-overflow:ellipsis}.grip{color:#676970;font-size:18px;letter-spacing:-4px;padding-right:4px}.sortable-ghost{opacity:.18}.sortable-chosen{border-color:#85878f}.footer-note{margin-top:12px;color:#676970;font-size:12px;line-height:1.5}.footer-note strong{color:#a2a4aa}.exporting .tier-actions{display:none}.exporting .tier{grid-template-columns:116px minmax(0,1fr)}.exporting .board-frame{border:0}.exporting .model{transform:none}
@media(max-width:760px){.app{width:100%;padding-top:12px}.toolbar{padding:0 12px}.search{order:5;width:100%}.board-frame{border-left:0;border-right:0}.board-head{padding:20px 14px}.board-head h1{font-size:24px}.tier{grid-template-columns:78px minmax(0,1fr) 44px;min-height:96px}.tier-label{font-size:20px;padding:6px}.items{padding:12px 10px;gap:8px}.model{min-height:46px;padding:5px 8px;gap:7px}.logo{width:32px;height:32px}.model-name{font-size:14px}.footer-note{padding:0 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
 <nav class="toolbar" aria-label="Tier list controls">
  <div class="segmented"><button class="active" data-preset="all">Original 15</button><button data-preset="open">Open weights</button></div>
  <input class="search" id="search" placeholder="Filter models" aria-label="Filter models">
  <div class="spacer"></div>
  <button class="tool-btn" id="addModel">Add model</button>
  <button class="tool-btn" id="reset">Reset</button>
  <button class="tool-btn primary" id="export">Export PNG</button>
 </nav>
 <section class="board-frame" id="capture" data-preset="all">
  <header class="board-head"><h1 id="title">AI model tier list</h1><span class="count" id="count">15 models</span><span class="open-badge">open weights</span></header>
  <div class="board" id="board"></div>
 </section>
 <p class="footer-note" id="note">Drag models between rows. Click a tier label to rename it. Your list is saved in this browser.</p>
</main>
<script src="assets/sortable.min.js"></script>

const byId = id => document.getElementById(id);
const clone = v => JSON.parse(JSON.stringify(v));
let currentPreset = 'all';
let state;
let sortables=[];

function modelMap(){return Object.fromEntries(state.models.map(m=>[m[0],{id:m[0],name:m[1],vendor:m[2]}]));}
function storageKey(){return 'model-tier-maker:v3:'+currentPreset;}
function load(preset){
 currentPreset=preset;
 localStorage.setItem('model-tier-maker:last-preset',preset);
 const raw=localStorage.getItem(storageKey());
 state=raw?JSON.parse(raw):clone(PRESETS[preset]);
 render();
}
function save(){localStorage.setItem(storageKey(),JSON.stringify(state));}
function syncFromDom(){
 document.querySelectorAll('.tier').forEach(row=>{
  const tier=state.tiers.find(t=>t.id===row.dataset.tier);
  tier.label=row.querySelector('.tier-label').textContent.trim()||'Tier';
  tier.items=[...row.querySelectorAll('.model')].map(el=>el.dataset.id);
 });
 save();
}
function makeModel(m){
 const vendor=VENDORS[m.vendor]||{name:m.vendor,logo:''};
 const el=document.createElement('div');
 el.className='model';el.dataset.id=m.id;el.dataset.search=(m.name+' '+vendor.name).toLowerCase();el.title=vendor.name;
 const img=document.createElement('img');img.className='logo';img.src=vendor.logo;img.alt='';img.draggable=false;
 const name=document.createElement('span');name.className='model-name';name.textContent=m.name;
 const grip=document.createElement('span');grip.className='grip';grip.setAttribute('aria-hidden','true');grip.textContent='⠿';
 el.append(img,name,grip);return el;
}
function render(){
 sortables.forEach(s=>s.destroy());sortables=[];
 const map=modelMap();
 byId('capture').dataset.preset=currentPreset;byId('title').textContent=state.title;
 byId('count').textContent=state.models.length+' models';
 document.querySelectorAll('[data-preset]').forEach(b=>{if(b.tagName==='BUTTON')b.classList.toggle('active',b.dataset.preset===currentPreset)});
 const board=byId('board');board.innerHTML='';
 state.tiers.forEach((tier,index)=>{
  const row=document.createElement('section');row.className='tier';row.dataset.tier=tier.id;
  const label=document.createElement('div');label.className='tier-label'+(tier.label.length>4?' long':'');label.contentEditable='true';label.spellcheck=false;label.style.background=tier.color;label.textContent=tier.label;
  label.addEventListener('blur',syncFromDom);label.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();label.blur();}});
  const items=document.createElement('div');items.className='items';tier.items.forEach(id=>{if(map[id])items.appendChild(makeModel(map[id]));});
  const actions=document.createElement('div');actions.className='tier-actions';
  const add=document.createElement('button');add.className='icon-btn';add.title='Add tier below';add.textContent='+';add.onclick=()=>addTier(index+1);
  const del=document.createElement('button');del.className='icon-btn';del.title='Remove tier';del.textContent='×';del.onclick=()=>removeTier(index);
  actions.append(add,del);row.append(label,items,actions);board.appendChild(row);
 });
 document.querySelectorAll('.items').forEach(el=>sortables.push(new Sortable(el,{group:'models',animation:150,delay:50,delayOnTouchOnly:true,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',onEnd:()=>{syncFromDom();applyFilter();}})));
 byId('search').value='';
}
function addTier(index){
 const colors=['#ff244d','#ff9500','#ffca28','#13d6a2','#43a5ff','#bd5df3','#f72fa6','#73767e'];
 state.tiers.splice(index,0,{id:'tier-'+Date.now(),label:'New',color:colors[index%colors.length],items:[]});save();render();
 setTimeout(()=>{const labels=document.querySelectorAll('.tier-label');labels[index].focus();document.execCommand('selectAll',false,null);},0);
}
function removeTier(index){
 if(state.tiers.length<=2)return;
 const [removed]=state.tiers.splice(index,1);state.tiers[state.tiers.length-1].items.push(...removed.items);save();render();
}
function applyFilter(){
 const q=byId('search').value.trim().toLowerCase();
 document.querySelectorAll('.model').forEach(el=>el.classList.toggle('filtered',q&&!el.dataset.search.includes(q)));
}
function addCustomModel(){
 const name=prompt('Model name');if(!name)return;
 const id='custom-'+Date.now();state.models.push([id,name,'openai']);state.tiers[state.tiers.length-1].items.push(id);save();render();
}
async function exportPng(){
 syncFromDom();byId('search').value='';applyFilter();document.body.classList.add('exporting');
 try{
  const canvas=await html2canvas(byId('capture'),{backgroundColor:'#09090a',scale:Math.min(2,window.devicePixelRatio||1),useCORS:true,logging:false});
  const a=document.createElement('a');a.download=(state.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'tier-list')+'.png';a.href=canvas.toDataURL('image/png');a.click();
 }finally{document.body.classList.remove('exporting');}
}
document.querySelectorAll('.segmented [data-preset]').forEach(b=>b.onclick=()=>load(b.dataset.preset));
byId('search').addEventListener('input',applyFilter);byId('addModel').onclick=addCustomModel;
byId('reset').onclick=()=>{localStorage.removeItem(storageKey());load(currentPreset)};byId('export').onclick=exportPng;
load(localStorage.getItem('model-tier-maker:last-preset')||'all');
</script>
</body>
</html>
